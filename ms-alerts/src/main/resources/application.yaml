spring:
  application:
    name: ms-alerts
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
      circuitbreaker:
        enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

server:
  port: 8088

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}

internal:
  api-key: ${INTERNAL_API_KEY}

clients:
  vehicle-service: ${VEHICLES_SERVICE_URL}
  driver-service: ${DRIVERS_SERVICE_URL}
  maintenance-service: ${MAINTENANCE_SERVICE_URL}
  fuel-service: ${FUEL_SERVICE_URL}

alerts:
  evaluation:
    interval-ms: ${ALERTS_EVALUATION_INTERVAL_MS}
    initial-delay-ms: 60000
  rules:
    seed: true
  webhook:
    url: ${WEBHOOK_URL}
    timeout-ms: ${WEBHOOK_TIMEOUT_MS}

x-resilience-defaults: &cb-defaults
  slidingWindowType: COUNT_BASED
  slidingWindowSize: 10
  minimumNumberOfCalls: 10
  failureRateThreshold: 50
  waitDurationInOpenState: 30s

x-timelimiter-defaults: &tl-defaults
  timeoutDuration: 15s

resilience4j:
  circuitbreaker:
    instances:
      ms-vehicles:
        <<: *cb-defaults
      ms-drivers:
        <<: *cb-defaults
      ms-maintenance:
        <<: *cb-defaults
      ms-fuel:
        <<: *cb-defaults
  timelimiter:
    instances:
      ms-vehicles:
        <<: *tl-defaults
      ms-drivers:
        <<: *tl-defaults
      ms-maintenance:
        <<: *tl-defaults
      ms-fuel:
        <<: *tl-defaults