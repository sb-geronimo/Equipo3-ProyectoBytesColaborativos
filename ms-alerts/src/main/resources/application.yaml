spring:
  application:
    name: ms-alerts
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
      circuitbreaker:
        enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/alerts_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver

server:
  port: 8088

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}

internal:
  api-key: ${INTERNAL_API_KEY}

clients:
  vehicle-service: ${VEHICLES_SERVICE_URL:http://localhost:8082}
  driver-service: ${DRIVERS_SERVICE_URL:http://localhost:8083}
  maintenance-service: ${MAINTENANCE_SERVICE_URL:http://localhost:8086}
  fuel-service: ${FUEL_SERVICE_URL:http://localhost:8087}

alerts:
  evaluation:
    interval-ms: ${ALERTS_EVALUATION_INTERVAL_MS:900000}
    initial-delay-ms: 60000
  rules:
    seed: true

x-resilience-defaults: &cb-defaults
  slidingWindowType: COUNT_BASED
  slidingWindowSize: 10
  minimumNumberOfCalls: 10
  failureRateThreshold: 50
  waitDurationInOpenState: 30s

resilience4j:
  circuitbreaker:
    instances:
      ms-vehicles:
        <<: *cb-defaults
      ms-drivers:
        <<: *cb-defaults
      ms-maintenance:
        <<: *cb-defaults
      ms-fuel:
        <<: *cb-defaults