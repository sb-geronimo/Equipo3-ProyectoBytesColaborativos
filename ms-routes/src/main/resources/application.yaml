spring:
  application:
    name: ms-routes
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/routes_db}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
      circuitbreaker:
        enabled: true

x-resilience-defaults: &cb-defaults
  slidingWindowType: COUNT_BASED
  slidingWindowSize: 10
  minimumNumberOfCalls: 10
  failureRateThreshold: 50
  waitDurationInOpenState: 30s

x-timelimiter-defaults: &tl-defaults
  timeoutDuration: 15s

resilience4j:
  circuitbreaker:
    instances:
      vehicle-service:
        <<: *cb-defaults
      driver-service:
        <<: *cb-defaults
  timelimiter:
    instances:
      vehicle-service:
        <<: *tl-defaults
      driver-service:
        <<: *tl-defaults

server:
  port: 8085

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}

internal:
  api-key: ${INTERNAL_API_KEY}

clients:
  vehicle-service: ${VEHICLE_SERVICE_URL:http://ms-vehicles:8082}
  driver-service: ${DRIVER_SERVICE_URL:http://ms-drivers:8083}
